# TEMPORARY. Isolates the last variable standing in the live-log investigation.
#
# Already ruled out by evidence:
#   - the engine: bisecting to the 12/06 version (terraform running bare, no
#     tee, no wrapper, no ::group::) fails identically
#   - network/extension blocking: the WebSocket to alive.github.com opens in
#     434ms in the affected browser
#
# What is left is that the real pipeline runs as a CALLED workflow
# ("Call GitOps Engine / deploy"), a nested job the Actions UI renders through
# a different path than an ordinary job.
#
# This run contains both shapes, printing the same thing at the same rate, so
# they can be watched side by side. No terraform, no client repo, no checkout.
#
#   both stream          -> live log is fine; the difference is elsewhere
#   only "direto" streams -> confirmed: the nested/called job is the problem
#   neither streams      -> broken for this account/browser regardless of shape
#
# Delete this file and logtest-reusable.yml once answered.
name: LOGTEST (temporary)

on:
  workflow_dispatch:

jobs:
  direto:
    runs-on: ubuntu-latest
    steps:
      - name: Tick for 3 minutes (DIRECT job)
        shell: bash
        run: |
          for i in $(seq 1 180); do
            echo "[DIRECT $i/180] $(date -u '+%H:%M:%S')Z - if this is moving, live log works here"
            sleep 1
          done
          echo "done"

  chamado:
    uses: ./.github/workflows/logtest-reusable.yml
