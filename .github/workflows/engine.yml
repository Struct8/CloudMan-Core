name: Dynamic GitOps Engine (Full)

on:
  workflow_call:
    inputs:
      default_region:
        required: false
        type: string
        default: "us-east-1"
  workflow_dispatch:
  push:
    paths:
      - '**/manifest.json'
      - '**/main.tf'

# >>> NOVO — Camada "concurrency": evita que duas runs do pipeline cheguem a
# competir pelo mesmo lock. O GitHub enfileira a segunda run em vez de deixar
# as duas rodarem juntas e brigarem pelo DynamoDB.
concurrency:
  group: terraform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  actions: read   # >>> NOVO — necessário para o `gh run view` usado no backstop de lock órfão

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Client Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # INICIO DA MODIFICAÇÃO
      - name: 🧐 Analyze Manifest Requirements
        id: manifest_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "🔍 Identificando qual pasta disparou o pipeline..."

          # 1. Tenta achar o manifesto na pasta que teve o código alterado
          MANIFEST_PATH=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep "manifest.json" | head -n 1 || true)

          # 2. Se for trigger manual ou não achar diff, pega o primeiro que encontrar (fallback)
          if [ -z "$MANIFEST_PATH" ] || [ ! -f "$MANIFEST_PATH" ]; then
            MANIFEST_PATH=$(find . -name "manifest.json" -not -path "*/.*" -print -quit)
          fi

          echo "========================================================="
          echo "📂 [LOG DE CAMINHO] MANIFESTO SELECIONADO NA ANÁLISE:"
          echo "Caminho: ${MANIFEST_PATH:-Nenhum encontrado}"
          echo "========================================================="

          if [ -z "$MANIFEST_PATH" ]; then
            echo "⚠️ Nenhum manifesto encontrado. Assumindo fluxo padrão (false)."
            echo "needs_private_access=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -s "$MANIFEST_PATH" ]; then
             echo "⚠️ Arquivo manifest.json existe mas está vazio."
             echo "needs_private_access=false" >> $GITHUB_OUTPUT
             exit 0
          fi

          if ! jq -e . "$MANIFEST_PATH" >/dev/null 2>&1; then
             echo "❌ ERRO CRÍTICO: O arquivo $MANIFEST_PATH contém JSON inválido."
             exit 1
          fi

          EXTERNAL_REPOS=$(jq -c '.external_repositories // []' "$MANIFEST_PATH")
          NEEDS_ACCESS="false"

          if [ "$EXTERNAL_REPOS" != "[]" ] && [ "$EXTERNAL_REPOS" != "null" ]; then
            echo "📦 Verificando visibilidade dos repositórios externos..."

            while IFS= read -r repo; do
              ORG=$(echo "$repo" | jq -r '.org')
              REPO_NAME=$(echo "$repo" | jq -r '.repo_name')

              echo "🔍 Checando API do GitHub para: $ORG/$REPO_NAME"

              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$ORG/$REPO_NAME")

              if [ "$HTTP_STATUS" == "200" ]; then
                echo "   ✅ Público (HTTP 200). Não requer token externo."
              else
                echo "   🔒 Privado (HTTP $HTTP_STATUS). Requer token do backend!"
                NEEDS_ACCESS="true"
                break
              fi
            done < <(echo "$EXTERNAL_REPOS" | jq -c '.[]')
          else
            echo "ℹ️ Nenhum repositório externo declarado no manifesto."
          fi

          echo "📊 Resultado da análise Gatekeeper: $NEEDS_ACCESS"

          # SALVANDO NA MEMÓRIA PARA O RESTO DO PIPELINE
          echo "needs_private_access=$NEEDS_ACCESS" >> $GITHUB_OUTPUT
          echo "manifest_path=$MANIFEST_PATH" >> $GITHUB_OUTPUT

      - name: 🔑 CloudMan Auth Bridge
        id: gatekeeper
        if: steps.manifest_check.outputs.needs_private_access == 'true'
        shell: bash
        run: |
          # 1. Roteamento Dinâmico (Dev vs Prod) baseado na branch
          STAGE="dev"
          GATEKEEPER_URL="https://dev.v2.cloudman.pro/st/GithubGateKeeper-dev"
          AUDIENCE="https://github.com/cloudmandevv2"
          echo "🚀 Detectado ambiente: $STAGE"
          echo "🔗 Acionando Gatekeeper em: $GATEKEEPER_URL"

          # 2. Pega o token OIDC do GitHub usando a audiência dinâmica
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&aud=$AUDIENCE" | jq -r '.value')

          # 3. Faz a chamada POST para o API Gateway correto
          # Nota: O header Content-Type é obrigatório aqui!
          # E passei o github_repo de forma dinâmica também: ${{ github.repository }}
          RESPONSE=$(curl -s -X POST "$GATEKEEPER_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"exchange_oidc_for_token\",
              \"params\": {
                \"oidc_token\": \"$ID_TOKEN\",
                \"github_repo\": \"${{ github.repository }}\"
              }
            }")

          # 4. Extrai o token do JSON de resposta
          TOKEN=$(echo $RESPONSE | jq -r .token)

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Falha na autenticação ($STAGE). Resposta do AWS API Gateway: $RESPONSE"
            exit 1
          fi

          # 5. Salva o token em segredo para os próximos steps usarem
          echo "✅ Autenticação bem-sucedida no ambiente $STAGE!"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: 📥 Checkout CloudMan Engine
        uses: actions/checkout@v4
        with:
          repository: CloudManPro/cloudman-core
          path: .cloudman-engine
          ref: main
          # LÓGICA CRÍTICA:
          # Se o gatekeeper rodou, usa o token dele.
          # Se pulou, usa o GITHUB_TOKEN padrão (funciona se a Engine for pública ou interna à org)
          token: ${{ steps.gatekeeper.outputs.token || secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"  # Adicione esta linha
          terraform_wrapper: false    # Recomendado para scripts bash complexos como o seu

      - name: 🚀 Executar Pipeline Modular
        shell: bash
        env:
          # Mesma lógica de fallback aqui para o clone dentro do script
          GH_CLONE_TOKEN: ${{ steps.gatekeeper.outputs.token || secrets.GITHUB_TOKEN }}
          LOGIN_REGION: ${{ inputs.default_region || 'us-east-1' }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # >>> NOVO — autentica o `gh run view` do backstop (camada 4)
          # >>> O manifest_path vem por env, nao inline, para nao interpolar valor
          # do GitHub direto no shell (evita injecao via conteudo do caminho).
          MANIFEST_PATH_INPUT: ${{ steps.manifest_check.outputs.manifest_path }}
        run: bash .cloudman-engine/scripts/pipeline.sh
      # >>> NOVO — STEP INTEIRO. Camada que resolve de verdade o caso principal
      # (apply/destroy cancelado ou com timeout). É um step SEPARADO, que só roda
      # depois que o step anterior já foi morto pelo GitHub Actions (SIGINT em t=0,
      # SIGTERM em t=7.5s, SIGKILL em t=10s — e nesse intervalo um trap dentro do
      # mesmo step não dá tempo de rodar, porque o bash fica bloqueado esperando o
      # terraform terminar e só processa o trap depois que o filho sai). Rodando
      # como step à parte, com `if: always()`, ele ganha minutos de orçamento em vez
      # de segundos, e o workspace (arquivos .terraform/terraform.tfstate de cada
      # path) continua disponível porque é o mesmo runner/job.
      # Só apaga o lock se confirmar que ele pertence a ESTA run (via o RUN_TAG
      # gravado no hostname lá em cima) — nunca um delete às cegas.
      - name: 🔓 Liberar locks órfãos após cancelamento/timeout
        if: always() && !success()
        shell: bash
        env:
          RUN_TAG: "gh-${{ github.run_id }}-${{ github.run_attempt }}"
          DEFAULT_REGION: ${{ inputs.default_region || 'us-east-1' }}
        run: |
          MANIFEST_PATH="${{ steps.manifest_check.outputs.manifest_path }}"
          [ -f "$MANIFEST_PATH" ] || exit 0

          jq -c '.pipeline_stages[].states[]' "$MANIFEST_PATH" | while read -r state; do
              path=$(echo "$state" | jq -r '.path')
              cache_file="$path/.terraform/terraform.tfstate"
              [ -f "$cache_file" ] || continue   # esse path nem chegou a dar init

              bucket=$(jq -r '.backend.config.bucket // empty' "$cache_file")
              key=$(jq -r '.backend.config.key // empty' "$cache_file")
              table=$(jq -r '.backend.config.dynamodb_table // empty' "$cache_file")
              region=$(jq -r '.backend.config.region // empty' "$cache_file")
              [ -n "$bucket" ] && [ -n "$key" ] && [ -n "$table" ] || continue

              item=$(aws dynamodb get-item \
                  --table-name "$table" \
                  --key "{\"LockID\": {\"S\": \"${bucket}/${key}\"}}" \
                  --region "${region:-$DEFAULT_REGION}" --profile backend 2>/dev/null)

              who=$(echo "$item" | jq -r '.Item.Info.S // empty' | jq -r '.Who // empty' 2>/dev/null)

              if [ "$who" == "runner@${RUN_TAG}" ]; then
                  echo "🔓 Lock em ${bucket}/${key} é desta run (${RUN_TAG}). Liberando..."
                  aws dynamodb delete-item --table-name "$table" \
                      --key "{\"LockID\": {\"S\": \"${bucket}/${key}\"}}" \
                      --region "${region:-$DEFAULT_REGION}" --profile backend
              elif [ -n "$who" ]; then
                  echo "ℹ️  Lock em ${bucket}/${key} pertence a '${who}' — não é meu, não mexo."
              fi
          done

      - name: 💾 Push / Cleanup GitOps State
        if: success()
        shell: bash
        run: |
          # Configura o bot do Github
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. LÓGICA DO PASSO 2 (GERAÇÃO DE IMPORT)
          if [ -f "$GITHUB_WORKSPACE/.needs_commit" ]; then
            echo "📥 Operação de import detectada. Salvando recursos gerados no repositório..."
            git add ./**/generated_resources.json

            if ! git diff --staged --quiet; then
              git commit -m "chore: código terraform gerado aguardando revisão do CloudMan [skip ci]"
              git push
              echo "✅ Código de importação enviado para o repositório."
            fi
          fi

          # 2. LÓGICA DO PASSO 4 (LIMPEZA PÓS-APPLY)
          if [ -f "$GITHUB_WORKSPACE/.needs_cleanup" ]; then
            echo "🧹 Operação de apply finalizada. Removendo arquivos de importação do repositório..."

            # O parâmetro -u no git add pega arquivos que foram deletados
            git add -u ./**/import.tf ./**/generated_resources.json ./**/generated_resources.tf 2>/dev/null || true

            if ! git diff --staged --quiet; then
              git commit -m "chore: cleanup import.tf and json after successful apply [skip ci]"
              git push
              echo "✅ Arquivos residuais excluídos do repositório com sucesso!"
            else
              echo "Nenhum arquivo residual para limpar no Git."
            fi
          fi

          echo "✅ Pipeline finalizado."
