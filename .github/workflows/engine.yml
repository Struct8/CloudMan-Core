name: Dynamic GitOps Engine (Full)

on:
  workflow_call:
    inputs:
      default_region:
        required: false
        type: string
        default: "us-east-1"
      stage:
        # Qual BACKEND do Struct8 este pipeline procura (Gatekeeper + audiência
        # OIDC). Eixo separado da VERSÃO do engine, que é o `@ref` do `uses:` no
        # workflow do cliente -- os dois costumam andar juntos, mas manter
        # separado permite rodar uma versão nova contra um backend antigo
        # durante uma migração.
        #
        # Default "dev" de propósito: até existir outro backend, todo cliente
        # (inclusive os reais) autentica pelo de dev, que é o comportamento em
        # vigor. Este input não muda nada sozinho.
        required: false
        type: string
        default: "dev"
      engine_ref:
        # Qual versão dos SCRIPTS este pipeline executa.
        #
        # Precisa ser dito explicitamente porque um workflow reutilizável NÃO
        # consegue descobrir a própria ref: `github.ref` é a do CHAMADOR, e
        # `github.job_workflow_sha` não é exposto ao `${{ }}` do `with:` (testado
        # -- resolve vazio). Sem este input o checkout abaixo ficava fixo em
        # `main`, e aí o `uses: ...@<ref>` do cliente escolhia só ESTE arquivo:
        # o cliente recebia o workflow novo rodando os scripts velhos, sem erro
        # em lugar nenhum. Mudança em scripts/ virava intestável.
        #
        # Quem gera o workflow do cliente já conhece o valor (é o mesmo do
        # `uses: ...@<ref>`) e deve emitir os dois juntos.
        required: false
        type: string
        default: "main"
  workflow_dispatch:
  push:
    paths:
      - '**/manifest.json'
      - '**/main.tf'

# NO `concurrency` HERE, deliberately.
#
# There used to be one, grouped by `repository + ref`, meant to stop two runs
# from fighting over the same DynamoDB lock. It was the wrong key and it cost
# more than it bought:
#
#   - Wrong granularity. Every state in a repository shares one branch, so
#     unrelated states -- different Terraform states, different locks, zero real
#     contention -- were serialized against each other for no reason.
#
#   - It DROPPED deploys. GitHub allows only ONE pending run per concurrency
#     group: when a third run arrives, the previously pending one is CANCELLED,
#     not queued behind it. Trigger three states in quick succession and the
#     middle one disappears without an error anywhere.
#
# The real lock is the DynamoDB one, and it is already per state -- which is the
# granularity that actually matters. Two runs on the SAME state now fail with
# "Error acquiring the state lock" instead of queueing. That is a deliberate
# trade: a visible, re-runnable failure beats a silently cancelled deploy.
#
# A stale lock (owner run already finished) is still recovered automatically --
# see run_tf_with_stale_lock_recovery in scripts/pipeline.sh, which confirms the
# owner's status through the API before forcing the unlock.
#
# Want queueing back WITHOUT the two problems above? It cannot be expressed
# here: workflow-level `concurrency` only sees the `github`, `inputs` and `vars`
# contexts, and the state path is only known after the manifest step runs. It
# would take splitting this into two jobs and keying a job-level `concurrency`
# off `needs.<job>.outputs.<path>`.

permissions:
  id-token: write
  contents: write
  actions: read   # >>> NOVO — necessário para o `gh run view` usado no backstop de lock órfão

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Client Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # INICIO DA MODIFICAÇÃO
      - name: 🧐 Analyze Manifest Requirements
        id: manifest_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Piso, usado quando o manifesto nao diz nada.
          ENGINE_REF_INPUT: ${{ inputs.engine_ref }}
        shell: bash
        run: |
          echo "🔍 Identifying which folder triggered the pipeline..."

          # Which SCRIPTS version this run executes.
          #
          # Read from the MANIFEST, which the app rewrites on every operation, so
          # it carries the stage of whoever triggered THIS run. That is what lets
          # two users of the same repository run different engine versions --
          # `jobs.<id>.uses` is fixed at link time and takes no expression, so the
          # workflow file cannot vary per run, but this checkout can.
          #
          # The input is the floor for callers whose manifest predates the field.
          ENGINE_REF_DEFAULT="${ENGINE_REF_INPUT:-main}"

          # 1. Tenta achar o manifesto na pasta que teve o código alterado
          MANIFEST_PATH=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep "manifest.json" | head -n 1 || true)

          # 2. Se for trigger manual ou não achar diff, pega o primeiro que encontrar (fallback)
          if [ -z "$MANIFEST_PATH" ] || [ ! -f "$MANIFEST_PATH" ]; then
            MANIFEST_PATH=$(find . -name "manifest.json" -not -path "*/.*" -print -quit)
          fi

          echo "========================================================="
          echo "📂 [PATH] MANIFEST SELECTED DURING ANALYSIS:"
          echo "Path: ${MANIFEST_PATH:-none found}"
          echo "========================================================="

          if [ -z "$MANIFEST_PATH" ]; then
            echo "⚠️ No manifest found. Assuming the default flow (false)."
            echo "needs_private_access=false" >> $GITHUB_OUTPUT
            echo "engine_ref=$ENGINE_REF_DEFAULT" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -s "$MANIFEST_PATH" ]; then
             echo "⚠️ manifest.json exists but is empty."
             echo "needs_private_access=false" >> $GITHUB_OUTPUT
             echo "engine_ref=$ENGINE_REF_DEFAULT" >> $GITHUB_OUTPUT
             exit 0
          fi

          if ! jq -e . "$MANIFEST_PATH" >/dev/null 2>&1; then
             echo "❌ CRITICAL ERROR: $MANIFEST_PATH contains invalid JSON."
             exit 1
          fi

          EXTERNAL_REPOS=$(jq -c '.external_repositories // []' "$MANIFEST_PATH")
          NEEDS_ACCESS="false"

          if [ "$EXTERNAL_REPOS" != "[]" ] && [ "$EXTERNAL_REPOS" != "null" ]; then
            echo "📦 Checking visibility of the external repositories..."

            while IFS= read -r repo; do
              ORG=$(echo "$repo" | jq -r '.org')
              REPO_NAME=$(echo "$repo" | jq -r '.repo_name')

              echo "🔍 Querying the GitHub API for: $ORG/$REPO_NAME"

              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$ORG/$REPO_NAME")

              if [ "$HTTP_STATUS" == "200" ]; then
                echo "   ✅ Public (HTTP 200). No external token required."
              else
                echo "   🔒 Private (HTTP $HTTP_STATUS). Backend token required."
                NEEDS_ACCESS="true"
                break
              fi
            done < <(echo "$EXTERNAL_REPOS" | jq -c '.[]')
          else
            echo "ℹ️ No external repository declared in the manifest."
          fi

          echo "📊 Gatekeeper analysis result: $NEEDS_ACCESS"

          ENGINE_REF=$(jq -r '.engine_ref // empty' "$MANIFEST_PATH")
          [ -z "$ENGINE_REF" ] && ENGINE_REF="$ENGINE_REF_DEFAULT"

          # Allowlist, not free choice. The manifest lives in the CLIENT's
          # repository, so this value is client-editable. `repository:` below is
          # fixed, so the worst case is running another version of OUR code and
          # never someone else's -- but an unknown ref would still mean checking
          # out whatever the manifest names. Same convention as the stage table:
          # refuse loudly instead of resolving something nobody chose.
          #
          # The ladder, lowest to highest: devlocal -> dev -> test -> alpha ->
          # main. Each is a branch here, each account is pinned to one by its
          # Cognito stage, and promoting is a merge forward. `devlocal` and `dev`
          # are separate on purpose: `devlocal` is whoever is running the
          # frontend from localhost, `dev` is the deployed dev environment, and
          # they must be able to hold different code at the same time.
          case "$ENGINE_REF" in
            devlocal|dev|test|alpha|main) ;;
            *)
              echo "❌ Engine channel '$ENGINE_REF' is not one this engine serves."
              echo "   Served today: devlocal, dev, test, alpha, main."
              exit 1
              ;;
          esac

          echo "⚙️ Engine scripts channel: $ENGINE_REF"

          # SALVANDO NA MEMÓRIA PARA O RESTO DO PIPELINE
          echo "needs_private_access=$NEEDS_ACCESS" >> $GITHUB_OUTPUT
          echo "manifest_path=$MANIFEST_PATH" >> $GITHUB_OUTPUT
          echo "engine_ref=$ENGINE_REF" >> $GITHUB_OUTPUT

      # THE ONE STEP THAT CANNOT BECOME A SCRIPT
      #
      # Everything else that carries changeable logic has moved to
      # `.struct8-engine/scripts/`, so a channel can evolve it without touching
      # this file. This step cannot follow, and the reason is an ordering
      # cycle rather than a preference: the token it produces is what the engine
      # CHECKOUT below authenticates with, so it has to run before the scripts
      # exist on disk. A script cannot bootstrap the checkout that fetches it.
      #
      # It works today with the client repository's own token as a fallback,
      # because this engine repository is public -- but leaning on that would
      # mean a change of visibility silently breaks every customer, and this
      # engine has already had a repository flip to private once.
      #
      # So it stays here, and the cost is real: a change to it lands on everyone
      # at once. Keep it to obtaining a token, and keep policy in inputs.
      - name: 🔑 Struct8 Auth Bridge
        id: gatekeeper
        if: steps.manifest_check.outputs.needs_private_access == 'true'
        shell: bash
        env:
          # Por env, não interpolado direto no shell: o valor vem do workflow do
          # cliente e cairia dentro de um `case` sem passar por aspas.
          STAGE_INPUT: ${{ inputs.stage }}
        run: |
          # 1. Backend do Struct8, por estágio.
          #
          # O comentário que vivia aqui dizia "Roteamento Dinâmico (Dev vs Prod)
          # baseado na branch" e a linha seguinte era STAGE="dev" fixo. Nunca foi
          # dinâmico -- e não poderia ser por branch: em workflow reutilizável
          # `github.ref` é a ref do CHAMADOR, não a deste arquivo. Por isso o
          # estágio agora CHEGA como input, em vez de ser adivinhado.
          #
          # Tabela explícita, mesma convenção (e mesmo motivo) do
          # GATEWAY_URL_BY_STAGE do frontend: estágio não mapeado FALHA ALTO em
          # vez de cair num default. Um cliente de 'test' autenticando calado no
          # Gatekeeper errado é precisamente o que a tabela existe pra impedir.
          STAGE="${STAGE_INPUT:-dev}"

          case "$STAGE" in
            dev)
              # Host: `dev.v2.cloudman.pro` NO LONGER EXISTS (NXDOMAIN) -- it was
              # left behind when the app moved to `app.struct8.com`. The curl
              # below died with exit 6 (couldn't resolve host).
              #
              # Audience: names the SERVICE this token is for, so it cannot be
              # replayed against another one. Deliberately a CONSTANT, and
              # deliberately NOT an org URL -- GitHub reserves the
              # `https://github.com/<org>` namespace and only ever issues a run
              # the URL of its OWN organization:
              #
              #   Can't issue ID_TOKEN for audience 'https://github.com/<other-org>'
              #
              # An org URL could therefore only ever serve clients inside that one
              # organization. The value below sits outside the reserved namespace,
              # so GitHub issues it to ANY client org. It does not resolve in DNS
              # and does not need to.
              #
              # The Gatekeeper validates it in ALLOWED_AUDIENCES, which still
              # accepts the previous org URL so engines mid-upgrade keep working.
              #
              # None of this surfaced for months because this whole step only
              # runs when the manifest declares a PRIVATE external repository.
              # Until 2026-07-28 the shared repository was (wrongly) public, so the
              # step's `if:` skipped everything.
              # TEMPORARIO -- REVERTER PARA dev.app ASSIM QUE O APPLY PASSAR.
              #
              # Um apply renomeou o no cldmn_subdomain de `app` para `appb`, e o Terraform
              # propagou o nome para os tres lugares onde ele aparece: destruiu o registro
              # DNS de dev.app.struct8.com, substituiu o certificado ACM e trocou o alias do
              # CloudFront. Este curl passou a morrer com exit 6.
              #
              # Isso trava a propria correcao: o conserto e aplicar o diagrama, e o apply
              # roda por este workflow, que precisa deste host para pegar o token.
              # appb e a MESMA distribuicao, com a MESMA rota -- medido: responde 400 a um
              # POST vazio, ou seja, a Lambda atende.
              #
              # A REVERSAO NAO E COSMETICA: o mesmo apply que restaura dev.app DESTROI
              # dev.appb. Deixar esta linha aqui troca um host morto por outro.
              #
              # Segunda vez que este host some por baixo deste arquivo -- a primeira foi
              # dev.v2.cloudman.pro, no comentario acima.
              GATEKEEPER_URL="https://dev.appb.struct8.com/st/GithubGateKeeper-dev"
              AUDIENCE="https://struct8.com/gitops"
              ;;
            *)
              echo "❌ Stage '$STAGE' has no backend mapped in this engine."
              echo "   Mapped today: dev. Add the case above when the stage is created."
              exit 1
              ;;
          esac

          echo "🚀 Environment: $STAGE"
          echo "🔗 Calling the Gatekeeper at: $GATEKEEPER_URL"

          # 2. Pega o token OIDC do GitHub usando a audiência dinâmica
          # The query parameter is `audience`, NOT `aud`. GitHub ignores unknown
          # parameters silently and issues its DEFAULT audience instead, which is
          # the owner URL (`https://github.com/<owner>`). With `aud=` this line
          # asked for one audience for years and always got the default -- and it
          # matched by pure accident while the repos lived under the previous
          # org. Moving to the Struct8 org made the default `.../Struct8` and the
          # Lambda started rejecting the JWT with "Audience doesn't match".
          # Fail LOUDLY when GitHub refuses to issue the token. The old code piped
          # curl straight into `jq -r '.value'`, so a refusal became the literal
          # string "null", got POSTed to the Gatekeeper, and came back as
          # "invalid OIDC identity" -- blaming the Lambda for a request that never
          # produced a token in the first place.
          OIDC_RESPONSE=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          OIDC_HTTP=$(echo "$OIDC_RESPONSE" | tail -n1)
          OIDC_BODY=$(echo "$OIDC_RESPONSE" | sed '$d')
          ID_TOKEN=$(echo "$OIDC_BODY" | jq -r '.value // empty')

          if [ -z "$ID_TOKEN" ]; then
            # Safe to print: there is no token in this branch, by definition.
            echo "❌ GitHub refused to issue an OIDC token (HTTP $OIDC_HTTP)."
            echo "   Requested audience: $AUDIENCE"
            echo "   Response: $OIDC_BODY"
            exit 1
          fi

          # 3. Faz a chamada POST para o API Gateway correto
          # Nota: O header Content-Type é obrigatório aqui!
          # E passei o github_repo de forma dinâmica também: ${{ github.repository }}
          RESPONSE=$(curl -s -X POST "$GATEKEEPER_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"exchange_oidc_for_token\",
              \"params\": {
                \"oidc_token\": \"$ID_TOKEN\",
                \"github_repo\": \"${{ github.repository }}\"
              }
            }")

          # 4. Extrai o token do JSON de resposta
          TOKEN=$(echo $RESPONSE | jq -r .token)

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Authentication failed ($STAGE). AWS API Gateway response: $RESPONSE"
            exit 1
          fi

          # 5. Salva o token em segredo para os próximos steps usarem
          echo "✅ Authenticated successfully against $STAGE!"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: 📥 Checkout Struct8 Engine
        uses: actions/checkout@v4
        with:
          # Canonical name. This named the PREVIOUS organization's repository
          # and only worked through GitHub's rename redirect. A redirect is not
          # a safe thing to depend on: it dies the moment anyone creates a new
          # repository under the old name, and the failure is silent -- you get
          # someone else's repository, not an error.
          repository: Struct8/CloudMan-Core
          path: .struct8-engine
          # The scripts half of the engine. See the `engine_ref` input for why the
          # caller has to state this instead of it being derived here.
          #
          # Defaults to `main`, so a caller that says nothing keeps exactly the
          # behaviour this had when the value was hardcoded.
          ref: ${{ steps.manifest_check.outputs.engine_ref || inputs.engine_ref }}
          # CRITICAL: use the Gatekeeper's token when that step ran; otherwise
          # fall back to GITHUB_TOKEN, which is enough while the engine is
          # public or internal to the org.
          token: ${{ steps.gatekeeper.outputs.token || secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"  # Adicione esta linha
          terraform_wrapper: false    # Recomendado para scripts bash complexos como o seu

      - name: 🚀 Run Modular Pipeline
        shell: bash
        env:
          # Mesma lógica de fallback aqui para o clone dentro do script
          GH_CLONE_TOKEN: ${{ steps.gatekeeper.outputs.token || secrets.GITHUB_TOKEN }}
          LOGIN_REGION: ${{ inputs.default_region || 'us-east-1' }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # >>> NOVO — autentica o `gh run view` do backstop (camada 4)
          # >>> O manifest_path vem por env, nao inline, para nao interpolar valor
          # do GitHub direto no shell (evita injecao via conteudo do caminho).
          MANIFEST_PATH_INPUT: ${{ steps.manifest_check.outputs.manifest_path }}
        run: bash .struct8-engine/scripts/pipeline.sh

      # >>> Publica o que os SCRIPTS decidiram publicar. Nada aqui sabe o que é.
      #
      # This step carries no knowledge of any particular file -- not its name,
      # not which folder it came from, not whether it should exist at all. It
      # uploads whatever `publish_engine_artifact` (in the scripts) left in the
      # directory below.
      #
      # That emptiness is the point. This file is ONE workflow shared by every
      # channel and every customer, so anything encoded here can only change for
      # everyone at once -- and a channel exists precisely so that it does not
      # have to. The scripts are checked out per channel, so keeping the decision
      # there is what lets `dev` publish something new while `main` does not,
      # from the same workflow, with no second job and no extra billed minute.
      #
      # Adding a new published file later is a change in the scripts of the
      # channel being developed. It never comes back here.
      #
      # `if-no-files-found: ignore` is what makes a channel that publishes
      # nothing a silent no-op rather than a warning. retention-days: 1 because
      # these are read once, right after the run, and are worthless afterwards --
      # keeping them longer would only spend the repository owner's quota.
      # compression-level: 0 because the scripts already compress what they
      # stage; deflating it again would spend CPU to shrink nothing.
      - name: 📤 Publish Engine Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-output
          path: ${{ runner.temp }}/struct8-artifacts
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      # >>> NOVO — STEP INTEIRO. Camada que resolve de verdade o caso principal
      # (apply/destroy cancelado ou com timeout). É um step SEPARADO, que só roda
      # depois que o step anterior já foi morto pelo GitHub Actions (SIGINT em t=0,
      # SIGTERM em t=7.5s, SIGKILL em t=10s — e nesse intervalo um trap dentro do
      # mesmo step não dá tempo de rodar, porque o bash fica bloqueado esperando o
      # terraform terminar e só processa o trap depois que o filho sai). Rodando
      # como step à parte, com `if: always()`, ele ganha minutos de orçamento em vez
      # de segundos, e o workspace (arquivos .terraform/terraform.tfstate de cada
      # path) continua disponível porque é o mesmo runner/job.
      # Só apaga o lock se confirmar que ele pertence a ESTA run (via o RUN_TAG
      # gravado no hostname lá em cima) — nunca um delete às cegas.
      - name: 🔓 Release orphaned locks after cancellation/timeout
        if: always() && !success()
        shell: bash
        env:
          RUN_TAG: "gh-${{ github.run_id }}-${{ github.run_attempt }}"
          DEFAULT_REGION: ${{ inputs.default_region || 'us-east-1' }}
        run: |
          # The engine checkout may not have happened -- this step runs precisely
          # WHEN SOMETHING FAILED, and the failure could BE that checkout. Without
          # this guard the recovery step would itself fail, on every run that died
          # early, reporting a missing file instead of the real cause.
          [ -f .struct8-engine/scripts/release-locks.sh ] || exit 0

          MANIFEST_PATH="${{ steps.manifest_check.outputs.manifest_path }}" bash .struct8-engine/scripts/release-locks.sh
      - name: 💾 Push / Cleanup GitOps State
        if: success()
        shell: bash
        run: |
          bash .struct8-engine/scripts/publish-gitops.sh
