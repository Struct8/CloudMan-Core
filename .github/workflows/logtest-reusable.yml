# TEMPORARY -- see logtest.yml. Delete both once the question is answered.
#
# The called half of the experiment. Identical output to the direct job; the
# only difference is that it is reached through `uses:`, which is how the real
# pipeline runs (Call GitOps Engine / deploy).
name: LOGTEST reusable (temporary)

on:
  workflow_call:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick for 3 minutes (CALLED job)
        shell: bash
        run: |
          for i in $(seq 1 180); do
            echo "[CALLED $i/180] $(date -u '+%H:%M:%S')Z - if this is moving, live log works here"
            sleep 1
          done
          echo "done"
